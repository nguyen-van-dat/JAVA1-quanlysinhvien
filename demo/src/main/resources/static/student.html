<!doctype html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý sinh viên</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" crossorigin="anonymous" />
    <link rel="stylesheet" href="/adminlte/css/adminlte.css" />
    <style>
        :root {
            --bg-1: #f4f7ff;
            --bg-2: #eef6ff;
            --panel: rgba(255, 255, 255, 0.8);
            --panel-soft: rgba(255, 255, 255, 0.65);
            --panel-strong: #ffffff;
            --primary: #6d5efc;
            --primary-2: #3da5ff;
            --success: #34c38f;
            --warning: #f5b942;
            --text: #1f2937;
            --muted: #64748b;
            --border: rgba(148, 163, 184, 0.22);
            --shadow: 0 20px 45px rgba(93, 116, 166, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background:
                radial-gradient(circle at top left, rgba(109, 94, 252, 0.10), transparent 24%),
                radial-gradient(circle at bottom right, rgba(61, 165, 255, 0.10), transparent 26%),
                linear-gradient(135deg, var(--bg-1), var(--bg-2));
            color: var(--text);
        }

        .page-shell {
            min-height: 100vh;
            padding: 28px 20px 42px;
        }

        .dashboard-wrap {
            max-width: 1320px;
            margin: 0 auto;
            min-height: calc(100vh - 70px);
        }

        .main-panel {
            background: rgba(255, 255, 255, 0.64);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 22px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
        }

        .main-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            margin-bottom: 24px;
            padding: 6px 4px 0;
        }

        .eyebrow {
            color: #5b5ce6;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            font-size: 0.72rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .main-header h1 {
            margin: 0;
            font-size: clamp(2rem, 3vw, 2.7rem);
            letter-spacing: -0.05em;
            font-weight: 800;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .search-wrap {
            width: min(350px, 100%);
        }

        .input-group {
            box-shadow: 0 12px 24px rgba(15, 23, 42, 0.22);
        }

        .input-group-text,
        .form-control,
        .btn {
            border-radius: 12px;
        }

        .input-group .form-control {
            border-left: 0;
        }

        .input-group-text {
            border-color: rgba(148, 163, 184, 0.25);
            background: rgba(255, 255, 255, 0.92);
            color: var(--muted);
        }

        .form-control {
            background: rgba(255, 255, 255, 0.88);
            border-color: rgba(148, 163, 184, 0.25);
            color: var(--text);
        }

        .btn {
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            border: none;
            box-shadow: 0 16px 28px rgba(139, 92, 246, 0.28);
        }

        .btn-outline-secondary {
            color: var(--text);
            border-color: rgba(148, 163, 184, 0.25);
            background: rgba(255, 255, 255, 0.9);
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 18px;
            margin-bottom: 26px;
        }

        .stat-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.98), rgba(244,247,255,0.88));
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 18px 20px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 14px 30px rgba(127, 140, 182, 0.10);
        }

        .stat-card::before {
            content: "";
            position: absolute;
            width: 130px;
            height: 130px;
            right: -30px;
            top: -40px;
            background: rgba(255,255,255,0.04);
            border-radius: 50%;
        }

        .stat-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--muted);
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 700;
        }

        .stat-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            font-size: 1.15rem;
        }

        .stat-card.primary .stat-icon {
            background: rgba(109, 94, 252, 0.12);
            color: #5b5ce6;
        }

        .stat-card.success .stat-icon {
            background: rgba(52, 195, 143, 0.12);
            color: #1a9d78;
        }

        .stat-card.warning .stat-icon {
            background: rgba(245, 185, 66, 0.12);
            color: #d78d00;
        }

        .stat-value {
            position: relative;
            z-index: 1;
            margin: 14px 0 0;
            font-size: clamp(1.7rem, 2vw, 2.35rem);
            font-weight: 800;
            letter-spacing: -0.05em;
        }

        .student-card {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid var(--border);
            border-radius: 26px;
            overflow: hidden;
            box-shadow: 0 20px 35px rgba(148, 163, 184, 0.13);
        }

        .card-header {
            background: rgba(255, 255, 255, 0.96);
            border-bottom: 1px solid var(--border);
            padding: 1.2rem 1.5rem;
        }

        .card-title {
            color: var(--text);
            font-size: 1.6rem;
            letter-spacing: -0.04em;
        }

        .badge-soft {
            display: inline-flex;
            align-items: center;
            padding: 0.45rem 0.75rem;
            border-radius: 999px;
            background: rgba(109, 94, 252, 0.10);
            color: #5347d8;
            border: 1px solid rgba(109, 94, 252, 0.18);
            font-size: 0.74rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .table {
            margin-bottom: 0;
        }

        .table thead th {
            background: rgba(248, 250, 255, 0.95);
            color: var(--muted);
            border-bottom: 1px solid var(--border);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-size: 0.72rem;
            padding-top: 0.96rem;
            padding-bottom: 0.96rem;
        }

        .table tbody td {
            background: rgba(255, 255, 255, 0.72);
            color: var(--text);
            padding: 1rem 0.95rem;
            border-bottom: 1px solid rgba(148, 163, 184, 0.08);
        }

        .table tbody tr:hover td {
            background: rgba(238, 244, 255, 0.95);
        }

        .badge-class {
            display: inline-flex;
            align-items: center;
            padding: 0.52rem 0.8rem;
            border-radius: 999px;
            background: rgba(59, 130, 246, 0.08);
            color: #3067d6;
            border: 1px solid rgba(59,130,246,0.12);
            font-weight: 700;
            font-size: 0.72rem;
        }

        .btn-action {
            width: 34px;
            height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            border: 0;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .btn-action:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 20px rgba(2, 6, 23, 0.2);
        }

        .btn-view {
            background: rgba(59, 130, 246, 0.12);
            color: #2563eb;
        }

        .btn-edit {
            background: rgba(245, 158, 11, 0.11);
            color: #b76a00;
        }

        .btn-delete {
            background: rgba(239, 68, 68, 0.10);
            color: #dc2626;
        }

        .modal-content {
            background: #ffffff;
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 22px;
            box-shadow: 0 28px 60px rgba(148, 163, 184, 0.22);
            overflow: hidden;
        }

        .modal-header {
            background: rgba(245, 247, 255, 0.96);
            border-bottom: 1px solid var(--border);
            padding: 1.15rem 1.25rem;
        }

        .modal-body {
            padding: 1.2rem 1.25rem 0.2rem;
        }

        .modal-footer {
            padding: 0.9rem 1.25rem 1.1rem;
            border-top: 0;
        }

        .form-label {
            color: #4b5563;
            font-weight: 600;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.94);
            border-color: rgba(148, 163, 184, 0.22);
            color: var(--text);
        }

        .form-control:focus {
            border-color: rgba(139, 92, 246, 0.65);
            box-shadow: 0 0 0 0.2rem rgba(139, 92, 246, 0.14);
        }

        @media (max-width: 980px) {
            .dashboard-wrap {
                grid-template-columns: 1fr;
            }

            .sidebar {
                padding: 18px 14px;
            }
        }

        @media (max-width: 768px) {
            .main-header {
                display: block;
            }

            .header-actions {
                margin-top: 16px;
                width: 100%;
                justify-content: stretch;
            }

            .search-wrap {
                width: 100%;
            }

            .stats-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body class="bg-body-tertiary">
    <div class="page-shell">
        <div class="dashboard-wrap">
            <main class="main-panel">
                <header class="main-header">
                    <div>
                        <div class="eyebrow">Management system</div>
                        <h1>Student dashboard</h1>
                    </div>

                    <div class="header-actions">
                        <div class="input-group input-group-sm search-wrap">
                            <span class="input-group-text"><i class="bi bi-search"></i></span>
                            <input id="searchInput" class="form-control" type="text" placeholder="Tìm kiếm sinh viên..." />
                            <button id="searchBtn" class="btn btn-outline-secondary" type="button">Tìm</button>
                        </div>
                        <button id="addStudentBtn" class="btn btn-primary btn-sm" type="button">
                            <i class="bi bi-plus-circle me-1"></i>Thêm mới
                        </button>
                    </div>
                </header>

                <div class="card student-card">
                    <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
                        <div>
                            <span class="badge-soft mb-2">Student list</span>
                            <h3 class="card-title mb-0 fw-bold">Danh sách sinh viên</h3>
                        </div>
                    </div>

                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th style="width: 15%;">Mã sinh viên</th>
                                        <th style="width: 20%;">Họ và tên</th>
                                        <th style="width: 20%;">Email</th>
                                        <th style="width: 20%;">Số điện thoại</th>
                                        <th style="width: 10%;">Lớp</th>
                                        <th style="width: 15%;" class="text-end">Hành động</th>
                                    </tr>
                                </thead>
                                <tbody id="studentTableBody">
                                    <tr>
                                        <td colspan="6" class="text-center text-muted py-4">Đang tải dữ liệu...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div class="modal fade" id="studentModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <form id="studentForm">
                    <div class="modal-header">
                        <h5 class="modal-title fw-bold">Thông tin sinh viên</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="studentId" />
                        <div class="mb-3">
                            <label for="studentCode" class="form-label fw-semibold">Mã sinh viên</label>
                            <input type="text" class="form-control" id="studentCode" required />
                        </div>
                        <div class="mb-3">
                            <label for="fullName" class="form-label fw-semibold">Họ và tên</label>
                            <input type="text" class="form-control" id="fullName" required />
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Email</label>
                            <input type="email" class="form-control" id="email" required />
                        </div>
                        <div class="mb-3">
                            <label for="phone" class="form-label fw-semibold">Số điện thoại</label>
                            <input type="tel" class="form-control" id="phone" required />
                        </div>
                        <div class="mb-3">
                            <label for="className" class="form-label fw-semibold">Lớp</label>
                            <input type="text" class="form-control" id="className" required />
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                        <button type="submit" class="btn btn-primary">Lưu</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/student.js"></script>
</body>
</html>
